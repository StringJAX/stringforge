name: release

# Build and publish stringforge to PyPI on a version tag, using PyPI Trusted
# Publishing (OIDC) -- no API tokens are stored.  Configure the trusted
# publisher on PyPI for this repository and the `pypi` environment before the
# first release.
#
# Release flow:
#   1. bump the version in stringforge/__init__.py AND pyproject.toml (in sync)
#   2. commit + push to main
#   3. git tag -a vX.Y.Z -m "stringforge X.Y.Z" && git push origin vX.Y.Z
#      -> this workflow builds the sdist+wheel and publishes them.
#
# NOTE: publish stringforge AFTER jaxvacua is on PyPI -- stringforge depends on
# jaxvacua, so an end-user `pip install stringforge` must be able to resolve it.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1