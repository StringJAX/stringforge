name: CI

# Runs the stringforge test suite on every push/PR to main.  The full suite
# runs in well under a minute, so no sharding is needed (cf. jaxvacua's sharded
# CI).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded in-flight runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install stringforge + deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # platformdirs is a transitive dep of cytools (pulled in via jaxvacua)
          # not declared by the cytools PyPI wheel; install it explicitly to
          # avoid a ModuleNotFoundError at import time.
          pip install platformdirs
          pip install -e .

      - name: Run tests
        env:
          JAX_ENABLE_X64: "1"
        run: pytest tests/ -q